[env:esp32dev]
platform = espressif32@6.3.2
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^6.21.2
  https://github.com/me-no-dev/ESPAsyncWebServer.git
  me-no-dev/AsyncTCP@^1.1.1
  adafruit/DHT sensor library@^1.4.4
test_build_src = yes
