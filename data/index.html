<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32智能家居控制系统</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ESP32智能家居控制系统</h1>
            <div class="wifi-status">
                <span>WiFi状态: <span id="wifi-status" class="offline">未连接</span></span>
                <span style="margin-left: 20px;">IP: <span id="ip-address">-</span></span>
            </div>
        </div>
        
        <!-- 导航栏 -->
        <div class="navbar">
            <button class="nav-button active" onclick="showPage('devices')">设备控制</button>
            <button class="nav-button" onclick="showPage('environment')">环境监测</button>
            <button class="nav-button" onclick="showPage('alarm')">告警设置</button>
            <button class="nav-button" onclick="showPage('config')">配置</button>
            <button class="nav-button" onclick="showPage('admin')">数据库管理</button>
        </div>
        
        <!-- 登录页面 -->
        <div id="login" class="page" style="display: none;">
            <div class="login-container">
                <div class="card">
                    <h2>管理员登录</h2>
                    <div class="form-group">
                        <label for="login-username">用户名</label>
                        <input type="text" id="login-username" class="full-width-input" placeholder="输入管理员用户名" value="admin">
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" class="full-width-input" placeholder="输入管理员密码" value="admin123">
                    </div>
                    <div class="form-actions">
                        <button class="update-button" onclick="login()">登录</button>
                        <div id="login-error" class="error-message"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 数据库管理页面 -->
        <div id="admin" class="page" style="display: none;">
            <div class="admin-container">
                <button class="logout-button" onclick="logout()">退出登录</button>
                <div class="card">
                    <h2>数据库管理</h2>
                    <div class="admin-section">
                        <h3>设备管理</h3>
                        <button class="update-button" onclick="showAddDeviceForm()">添加设备</button>
                        <div id="device-list-admin" class="device-list-admin">
                            <!-- 设备列表将通过JavaScript动态生成 -->
                        </div>
                    </div>
                    
                    <div class="admin-section">
                        <h3>传感器数据</h3>
                        <div class="filter-options">
                            <select id="sensor-type-filter">
                                <option value="">所有传感器类型</option>
                                <option value="temperature">温度</option>
                                <option value="humidity">湿度</option>
                                <option value="light">光照</option>
                                <option value="smoke">烟雾</option>
                            </select>
                            <button class="update-button" onclick="filterSensorData()">筛选</button>
                        </div>
                        <div id="sensor-data-list" class="sensor-data-list">
                            <!-- 传感器数据将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
                
                <!-- 添加设备表单 -->
                <div id="add-device-form" class="card" style="display: none;">
                    <h3>添加新设备</h3>
                    <div class="form-group">
                        <label for="new-device-name">设备名称</label>
                        <input type="text" id="new-device-name" class="full-width-input" placeholder="输入设备名称">
                    </div>
                    <div class="form-group">
                        <label for="new-device-type">设备类型</label>
                        <select id="new-device-type" class="full-width-input">
                            <option value="light">智能灯</option>
                            <option value="switch">智能开关</option>
                            <option value="buzzer">蜂鸣器</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="new-device-pin">GPIO引脚</label>
                        <input type="number" id="new-device-pin" class="full-width-input" placeholder="输入GPIO引脚号">
                    </div>
                    <div class="form-actions">
                        <button class="update-button" onclick="addDevice()">保存</button>
                        <button class="cancel-button" onclick="hideAddDeviceForm()">取消</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 设备控制页面 -->
        <div id="devices" class="page">
            <button class="update-button" onclick="refreshAll()">手动刷新</button>
            <div class="card">
                <h2>设备控制</h2>
                <ul id="device-list" class="device-list">
                    <!-- 设备列表将通过JavaScript动态生成 -->
                </ul>
            </div>
        </div>
        
        <!-- 环境监测页面 -->
        <div id="environment" class="page" style="display: none;">
            <button class="update-button" onclick="refreshAll()">手动刷新</button>
            <div class="card">
                <h2>环境监测</h2>
                <div id="environment-data" class="environment-data">
                    <!-- 环境数据将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
        
        <!-- 告警设置页面 -->
        <div id="alarm" class="page" style="display: none;">
            <button class="update-button" onclick="refreshAll()">手动刷新</button>
            <div class="card">
                <h2>告警设置</h2>
                <div id="alarm-settings">
                    <div class="device-item" style="align-items: flex-start;">
                        <div class="device-info" style="min-width: 140px; padding-top: 8px;">
                            <div class="device-name">烟雾报警阈值设置</div>
                            <div class="device-type">传感器：smoke</div>
                        </div>
                        
                        <div style="flex: 1; margin-left: 20px;">
                            <!-- 第一行：当前设置状态 -->
                            <div class="status-bar" style="text-align: left; padding: 10px 15px; margin-bottom: 15px; background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9;">
                                <strong>当前生效配置：</strong> <span id="smoke-current">加载中...</span>
                            </div>

                            <!-- 第二行：编辑控制区域 -->
                            <div style="display: flex; align-items: flex-end; gap: 15px; flex-wrap: wrap;">
                                <div style="display: flex; flex-direction: column;">
                                    <label class="control-label" style="font-size: 12px; color: #666;">最小阈值 (Min)</label>
                                    <input type="number" id="smoke-min" min="0" max="4095" step="1" class="full-width-input" placeholder="无" style="width: 100px; padding: 8px;">
                                </div>
                                
                                <div style="display: flex; flex-direction: column;">
                                    <label class="control-label" style="font-size: 12px; color: #666;">最大阈值 (Max)</label>
                                    <input type="number" id="smoke-max" min="0" max="4095" step="1" class="full-width-input" placeholder="500" style="width: 100px; padding: 8px;">
                                </div>

                                <div style="display: flex; flex-direction: column; align-items: flex-start; padding-bottom: 5px;">
                                    <label class="control-label" style="font-size: 12px; color: #666; margin-bottom: 5px;">启用告警</label>
                                    <select id="smoke-enabled-select" class="full-width-input" style="width: 100px; padding: 8px;">
                                        <option value="1">启用</option>
                                        <option value="0">禁用</option>
                                    </select>
                                </div>

                                <button class="update-button" onclick="saveSmokeThreshold()" style="margin: 0; height: 38px; margin-bottom: 2px;">保存设置</button>
                                
                                <div style="font-size: 12px; color: #888; margin-bottom: 10px; flex: 1; min-width: 200px; text-align: right; align-self: center;">
                                    建议阈值500 (ADC/ppm)
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 配置页面内容 -->
    <div id="config" class="page" style="display: none;">
        <div class="config-container">
            <!-- WiFi配置区域 -->
            <div class="card">
                <h2>WiFi配置</h2>
                <div class="config-group">
                    <label for="wifi-ssid">WiFi名称 (SSID)</label>
                    <input type="text" id="wifi-ssid" class="full-width-input" placeholder="输入WiFi名称">
                </div>
                <div class="config-group">
                    <label for="wifi-password">WiFi密码</label>
                    <input type="password" id="wifi-password" class="full-width-input" placeholder="输入WiFi密码">
                </div>
                <div class="config-group">
                    <label class="control-label">DHCP设置</label>
                    <div style="display: flex; align-items: center;">
                        <input type="checkbox" id="dhcp-enabled" checked>
                        <label for="dhcp-enabled" style="margin-left: 10px;">启用DHCP</label>
                    </div>
                </div>
                <div id="static-ip-config" class="config-group" style="display: none;">
                    <h3>静态IP配置</h3>
                    <div class="config-group">
                        <label for="static-ip">IP地址</label>
                        <input type="text" id="static-ip" class="full-width-input" placeholder="输入IP地址">
                    </div>
                    <div class="config-group">
                        <label for="gateway">网关</label>
                        <input type="text" id="gateway" class="full-width-input" placeholder="输入网关地址">
                    </div>
                    <div class="config-group">
                        <label for="subnet-mask">子网掩码</label>
                        <input type="text" id="subnet-mask" class="full-width-input" placeholder="输入子网掩码">
                    </div>
                    <div class="config-group">
                        <label for="dns-server">DNS服务器</label>
                        <input type="text" id="dns-server" class="full-width-input" placeholder="输入DNS服务器地址">
                    </div>
                </div>
            </div>
            
            <!-- 保存按钮 -->
            <div class="config-actions">
                <button class="update-button" onclick="saveConfig()">保存配置</button>
                <button class="update-button" onclick="loadConfig()">加载当前配置</button>
            </div>
        </div>
    </div>
    
    <script src="/script.js"></script>
</body>
</html>
